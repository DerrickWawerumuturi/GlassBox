name: deploy backend

on:
  push:
    branches: [main]
    # Monorepo: the frontend deploys itself via Vercel. Rebuilding a 1 GB
    # image and restarting the container app for a CSS change is pure waste.
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Never beside a job pool run (job-pool.yml): this job re-reads the pool
    # under the new PROFILER_VERSION, and a collector on the old image must not
    # undo it halfway. Queued, not cancelled.
    concurrency:
      group: pool-and-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image
        run: |
          IMAGE=jobradarregistry.azurecr.io/jobradar:${GITHUB_SHA::8}
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 -t "$IMAGE" ./backend

      # Inside the image that is about to ship, so the tests see its exact
      # dependencies. A failure here stops the deploy before anything is pushed.
      - name: Test
        run: |
          docker run --rm -v "$PWD/backend/tests:/app/tests:ro" "$IMAGE" \
            sh -c "pip install -q pytest && python -m pytest -q -p no:cacheprovider tests"

      - name: Push image
        run: |
          az acr login --name jobradarregistry
          docker push "$IMAGE"

      # Before the new revision takes traffic: code may rely on the new schema,
      # and every migration is additive, so the old revision keeps working.
      # `-e DATABASE_URL` passes the variable by name — its value is never on a
      # command line. Parts are masked in case a driver error quotes them.
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.JOBRADAR_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "JOBRADAR_DATABASE_URL is not set on this repository"; exit 1
          fi
          python3 -c "
          import os, urllib.parse as u
          p = u.urlsplit(os.environ['DATABASE_URL'])
          for part in (p.username, p.password, p.hostname):
              if part: print('::add-mask::' + part)
          "
          docker run --rm -e DATABASE_URL "$IMAGE" python -m src.database.migrate

      # Opportunities reads only profiles from this image's PROFILER_VERSION. When
      # a release bumps it (a rules or skills.txt change), the pool must be
      # re-read now, not at the next collection run, or Opportunities is empty
      # until then. Incremental: with nothing stale it takes about a second.
      - name: Re-profile stale jobs
        env:
          DATABASE_URL: ${{ secrets.JOBRADAR_DATABASE_URL }}
        run: docker run --rm -e DATABASE_URL "$IMAGE" python -m src.jobpool.daily --profile-only

      # GLASSBOX_TEST_KEY must be a backend-only Container App secret.
      # If it was added as a plain environment value, move it into the secret
      # store without printing it. If it exists as a secret under a common
      # spelling, map that secret to the expected environment variable.
      - name: Ensure internal scan key is mapped as a backend secret
        run: |
          set -euo pipefail
          ENV_JSON="$(az containerapp show -n jobradar-backend -g jobradar-rg --query properties.template.containers[0].env -o json)"
          SECRET_REF="$(printf '%s' "$ENV_JSON" | jq -r '.[] | select(.name == "GLASSBOX_TEST_KEY") | .secretRef // empty' | head -n1)"
          if [ -z "$SECRET_REF" ]; then
            SECRET_NAMES="$(az containerapp secret list -n jobradar-backend -g jobradar-rg --query '[].name' -o tsv)"
            SECRET_REF="$(printf '%s\n' "$SECRET_NAMES" | awk 'tolower($0)=="glassbox-test-key" || tolower($0)=="glassbox_test_key" || tolower($0)=="glassboxtestkey" || tolower($0)=="internal-test-key" {print; exit}')"
            if [ -z "$SECRET_REF" ]; then
              DIRECT_VALUE="$(printf '%s' "$ENV_JSON" | jq -r '.[] | select(.name == "GLASSBOX_TEST_KEY") | .value // empty' | head -n1)"
              if [ -n "$DIRECT_VALUE" ]; then
                echo "::add-mask::$DIRECT_VALUE"
                az containerapp secret set -n jobradar-backend -g jobradar-rg --secrets "glassbox-test-key=$DIRECT_VALUE" -o none
                SECRET_REF="glassbox-test-key"
              fi
            fi
            if [ -z "$SECRET_REF" ]; then
              # No key exists in the app yet. Provision a fresh random internal
              # credential in Azure rather than blocking every backend release.
              # It is masked immediately, never written to GitHub or printed.
              DIRECT_VALUE="$(openssl rand -hex 32)"
              echo "::add-mask::$DIRECT_VALUE"
              az containerapp secret set -n jobradar-backend -g jobradar-rg --secrets "glassbox-test-key=$DIRECT_VALUE" -o none
              SECRET_REF="glassbox-test-key"
              echo "Provisioned a new backend-only internal scan credential in Azure."
            fi
            az containerapp update -n jobradar-backend -g jobradar-rg --set-env-vars "GLASSBOX_TEST_KEY=secretref:$SECRET_REF" -o none
          fi

      - name: Update container app
        # -o none: the default output dumps the full app config, env values
        # included — never printable on a public repo's Actions log.
        run: |
          az containerapp update \
            -n jobradar-backend \
            -g jobradar-rg \
            --image "$IMAGE" \
            -o none

      # :live is the image the API runs. job-pool.yml runs the collector in it,
      # so the collector's code, dependencies and PROFILER_VERSION are always
      # the API's. Moved only after the container app took the new image.
      - name: Tag the live image
        run: |
          docker tag "$IMAGE" jobradarregistry.azurecr.io/jobradar:live
          docker push jobradarregistry.azurecr.io/jobradar:live

      - name: Smoke test
        # A fresh revision can take minutes to pull and take traffic, and a cold
        # start answers in about 25 s (15 Oct 2026: 10 s checks over 2 minutes failed
        # a healthy release). Poll for about 7 minutes, 30 s per check.
        run: |
          for i in $(seq 1 14); do
            if curl --silent --fail --max-time 30 \
              https://jobradar-backend.agreeabledune-79b95957.southafricanorth.azurecontainerapps.io/health; then
              echo " — healthy on check $i"; exit 0
            fi
            sleep 15
          done
          echo "backend never became healthy"; exit 1

      - name: Verify monthly market history endpoint
        run: |
          curl --silent --show-error --fail --max-time 45 https://jobradar-backend.agreeabledune-79b95957.southafricanorth.azurecontainerapps.io/market/history | python3 -c 'import json,sys; d=json.load(sys.stdin); assert isinstance(d.get("series"), list); print("Monthly history API verified:", len(d["series"]), "rows")'

      # A credentialed malformed upload is intentional: it exercises the
      # production middleware and counter classification without consuming a
      # real CV, invoking the model or creating user data. Only test counters
      # may change. The key is read from the Container App secret store and is
      # never printed or passed on a command line.
      - name: Verify internal scan credential isolation
        env:
          DATABASE_URL: ${{ secrets.JOBRADAR_DATABASE_URL }}
        run: |
          set -euo pipefail
          ENV_JSON="$(az containerapp show -n jobradar-backend -g jobradar-rg --query properties.template.containers[0].env -o json)"
          SECRET_REF="$(printf '%s' "$ENV_JSON" | jq -r '.[] | select(.name == "GLASSBOX_TEST_KEY") | .secretRef // empty' | head -n1)"
          if [ -z "$SECRET_REF" ]; then echo "GLASSBOX_TEST_KEY is not mapped from an Azure Container App secret"; exit 1; fi
          TEST_KEY="$(az containerapp secret list -n jobradar-backend -g jobradar-rg --query "[?name=='$SECRET_REF'].value | [0]" -o tsv)"
          if [ -z "$TEST_KEY" ]; then echo "The mapped GLASSBOX_TEST_KEY secret is empty or unavailable"; exit 1; fi
          echo "::add-mask::$TEST_KEY"
          docker run --rm -e DATABASE_URL -e TEST_KEY -e BASE_URL=https://jobradar-backend.agreeabledune-79b95957.southafricanorth.azurecontainerapps.io "$IMAGE" python - <<'PY'
          import os, time
          import psycopg, requests

          def totals():
              with psycopg.connect(os.environ["DATABASE_URL"]) as conn, conn.cursor() as cur:
                  cur.execute("""
                      select coalesce(sum(scans_started), 0), coalesce(sum(scans_failed), 0),
                             coalesce(sum(test_scans_started), 0), coalesce(sum(test_scans_failed), 0)
                      from daily_counts where day = (now() at time zone 'utc')::date
                  """)
                  return tuple(cur.fetchone())

          before = totals()
          response = requests.post(
              os.environ["BASE_URL"] + "/analyze",
              headers={"X-Glassbox-Test-Key": os.environ["TEST_KEY"]},
              files={"file": ("internal-test.pdf", b"PK\\x03\\x04 not-a-pdf", "application/pdf")},
              timeout=120,
          )
          if response.status_code != 415:
              raise SystemExit(f"Internal scan probe returned unexpected HTTP {response.status_code}")
          after = before
          for _ in range(15):
              time.sleep(1)
              after = totals()
              if after[2] == before[2] + 1 and after[3] == before[3] + 1:
                  break
          if after[2] != before[2] + 1 or after[3] != before[3] + 1:
              raise SystemExit("Credentialed probe did not increment exactly one internal started/failed counter")
          if after[0] != before[0] or after[1] != before[1]:
              raise SystemExit("Credentialed probe contaminated production scan counters")
          print("Internal credential verified: test counters incremented; production counters unchanged.")
          PY
