name: deploy backend

on:
  push:
    branches: [main]
    # Monorepo: the frontend deploys itself via Vercel. Rebuilding a 1 GB
    # image and restarting the container app for a CSS change is pure waste.
    paths:
      - 'backend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# One deploy at a time; a newer push supersedes a queued one.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Build image
        run: |
          IMAGE=jobradarregistry.azurecr.io/jobradar:${GITHUB_SHA::8}
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 -t "$IMAGE" ./backend

      # Inside the image that is about to ship, so the tests see its exact
      # dependencies. A failure here stops the deploy before anything is pushed.
      - name: Test
        run: |
          docker run --rm -v "$PWD/backend/tests:/app/tests:ro" "$IMAGE" \
            sh -c "pip install -q pytest && python -m pytest -q -p no:cacheprovider tests"

      - name: Push image
        run: |
          az acr login --name jobradarregistry
          docker push "$IMAGE"

      # Before the new revision takes traffic: code may rely on the new schema,
      # and every migration is additive, so the old revision keeps working.
      # `-e DATABASE_URL` passes the variable by name — its value is never on a
      # command line. Parts are masked in case a driver error quotes them.
      - name: Apply migrations
        env:
          DATABASE_URL: ${{ secrets.JOBRADAR_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "JOBRADAR_DATABASE_URL is not set on this repository"; exit 1
          fi
          python3 -c "
          import os, urllib.parse as u
          p = u.urlsplit(os.environ['DATABASE_URL'])
          for part in (p.username, p.password, p.hostname):
              if part: print('::add-mask::' + part)
          "
          docker run --rm -e DATABASE_URL "$IMAGE" python -m src.database.migrate

      - name: Update container app
        # -o none: the default output dumps the full app config, env values
        # included — never printable on a public repo's Actions log.
        run: |
          az containerapp update \
            -n jobradar-backend \
            -g jobradar-rg \
            --image "$IMAGE" \
            -o none

      - name: Smoke test
        # A fresh revision can take a minute to pull and take traffic —
        # poll rather than judge on one shot.
        run: |
          for i in $(seq 1 12); do
            if curl --silent --fail --max-time 10 \
              https://jobradar-backend.agreeabledune-79b95957.southafricanorth.azurecontainerapps.io/health; then
              echo " — healthy after ${i}0s"; exit 0
            fi
            sleep 10
          done
          echo "backend never became healthy"; exit 1
