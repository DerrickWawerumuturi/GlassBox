name: refresh job pool

on:
  schedule:
    # 05:00 UTC — before the working day starts in Nairobi, London and Berlin.
    - cron: "0 5 * * *"
  workflow_dispatch:

# A slow run must never overlap the next one.
concurrency:
  group: job-pool
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The fetcher imports none of the ML stack; installing requirements.txt
      # would pull ~1 GB of torch for a job that only makes HTTP calls.
      - name: Install fetcher dependencies
        run: pip install "psycopg[binary]" psycopg_pool pydantic python-dotenv requests pycountry

      # The only step that sees the database. GitHub masks the secret as a whole
      # string; its parts are masked too, because a driver error can quote the
      # host or user on their own.
      - name: Fetch and store
        env:
          DATABASE_URL: ${{ secrets.JOBRADAR_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "JOBRADAR_DATABASE_URL is not set on this repository"; exit 1
          fi
          python -c "
          import os, urllib.parse as u
          p = u.urlsplit(os.environ['DATABASE_URL'])
          for part in (p.username, p.password, p.hostname):
              if part: print('::add-mask::' + part)
          "
          python -m src.jobpool.daily
