name: refresh job pool

on:
  schedule:
    # Every 6 hours. GitHub starts scheduled runs late (4 to 7 hours in
    # Sep-Oct 2026), so no run is relied on: freshness only needs one success
    # a day, and the weekly publication (src/jobpool/publish.py) is made by the
    # first run after Monday 00:00 UTC, whenever it starts.
    - cron: "17 */6 * * *"
  workflow_dispatch:

# One at a time, and never beside a deploy: a deploy re-reads the pool under
# its new PROFILER_VERSION, and a run on the old image must not undo that.
# deploy.yml's job takes the same group.
concurrency:
  group: pool-and-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # The image the API runs (deploy.yml tags it :live once the container
      # app runs it), so the collector has the app's full dependencies and its
      # PROFILER_VERSION. On 6 and 7 Oct 2026 a hand-picked package list here
      # missed groq and both runs died on import.
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Pull the deployed image
        run: |
          az acr login --name jobradarregistry
          docker pull jobradarregistry.azurecr.io/jobradar:live

      # The only step that sees the database. GitHub masks the secret as a whole
      # string; its parts are masked too, because a driver error can quote the
      # host or user on their own. `-e DATABASE_URL` passes it by name: its value
      # is never on a command line.
      - name: Collect, count and publish
        env:
          DATABASE_URL: ${{ secrets.JOBRADAR_DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "JOBRADAR_DATABASE_URL is not set on this repository"; exit 1
          fi
          python3 -c "
          import os, urllib.parse as u
          p = u.urlsplit(os.environ['DATABASE_URL'])
          for part in (p.username, p.password, p.hostname):
              if part: print('::add-mask::' + part)
          "
          docker run --rm -e DATABASE_URL jobradarregistry.azurecr.io/jobradar:live python -m src.jobpool.daily
